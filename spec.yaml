# Nests Due for Hatching — Daily Operations Workflow
#
# Data source: suspected_nest_v2 only.
#
# attempt_v2 is excluded from this workflow. It records crawls where the turtle
# made body pits but did not lay eggs, so no expected_hatching_date exists and
# it carries no hatching schedule information.

id: nests_due_hatching

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge
  - name: ecoscope-workflows-ext-curacao
    version: "0.0.4"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    # ── Time Range ────────────────────────────────────────────────────────────────
    time_range.properties.until.description: >
      The end time. Also used as "today" when computing each nest's status
      (Overdue / Due within 7 days / Active) — set this to the actual current
      date for accurate results.

    # ── Status Colors ─────────────────────────────────────────────────────────────
    nests_colormap.properties.custom_colors.default:
      - "#e53e3e"
      - "#dd6b20"
      - "#38a169"
      - "#718096"
    nests_colormap.properties.custom_colors.description: >
      Colors for Overdue, Due within 7 days, Active — in that order.

    # ── Grouping ──────────────────────────────────────────────────────────────────
    groupers.properties.groupers.items.anyOf:
      - "$ref": "#/$defs/ValueGrouper"
    groupers.properties.groupers.default:
      - index_name: beach

    # ── Map Zoom ──────────────────────────────────────────────────────────────────
    Nests Map.properties.nests_map_max_zoom.properties.var.title: Max Zoom
    Nests Map.properties.nests_map_max_zoom.properties.var.default: 17
    Nests Map.properties.nests_map_max_zoom.properties.var.description: "Maximum zoom level for the nests map."

  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: beach
        title: Beach
      - const: location
        title: Location

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  - name: Set Groupers
    id: groupers
    task: set_groupers

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  # ── Fetch & Process ───────────────────────────────────────────────────────────

  - name: Fetch Nest Events
    id: all_events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - geometry
        - event_details
      event_types:
        - suspected_nest_v2
      include_details: true
      include_display_values: true
      raise_on_empty: false
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      force_point_geometry: true

  - name: Process Event Details
    id: all_events_processed
    task: process_events_details
    partial:
      df: ${{ workflow.all_events.return }}
      client: ${{ workflow.er_client.return }}
      map_to_titles: true
      ordered: false

  - name: Extract Nest Due Fields
    id: nests_df
    task: extract_nest_due_fields
    partial:
      df: ${{ workflow.all_events_processed.return }}
      time_range: ${{ workflow.time_range.return }}

  # Colormap runs once on the full (ungrouped) dataframe so that every group
  # shares the same status→color assignment — apply_color_map assigns colors by
  # first-appearance order of the values it's given, so running it per-group
  # instead would risk different colors for the same status in different groups.
  - name: Nests Colormap
    id: nests_colormap
    task: apply_qualitative_color_map
    partial:
      df: ${{ workflow.nests_df.return }}
      input_column_name: status
      colormap: Set1

  - name: Split by Groupers
    id: grouped_nests
    task: split_groups
    partial:
      df: ${{ workflow.nests_colormap.return }}
      groupers: ${{ workflow.groupers.return }}

  # ── Headline Stats ────────────────────────────────────────────────────────────

  - title: Headline Stats
    type: task-group
    description: Count of nests that are overdue or due within 7 days, per group.
    tasks:

      - name: Filter Overdue Nests
        id: overdue_nests
        task: filter_row_values
        partial:
          column: status
          values:
            - Overdue
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_nests.return }}

      - name: Overdue Nests Count
        id: overdue_count
        task: dataframe_count
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.overdue_nests.return }}

      - name: Overdue Nests Widget
        id: overdue_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Overdue Nests"
          decimal_places: 0
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.overdue_count.return }}

      - name: Merge Overdue Nests Widget Views
        id: overdue_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.overdue_widget.return }}

      - name: Filter Nests Due Within 7 Days
        id: due7_nests
        task: filter_row_values
        partial:
          column: status
          values:
            - Due within 7 days
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_nests.return }}

      - name: Nests Due Within 7 Days Count
        id: due7_count
        task: dataframe_count
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.due7_nests.return }}

      - name: Nests Due Within 7 Days Widget
        id: due7_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Due Within 7 Days"
          decimal_places: 0
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.due7_count.return }}

      - name: Merge Due Within 7 Days Widget Views
        id: due7_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.due7_widget.return }}

  # ── Map ───────────────────────────────────────────────────────────────────────

  - title: Nests Map
    type: task-group
    description: ""
    tasks:

      - id: nests_map_max_zoom
        task: set_int_var

      - id: nests_layer
        task: create_nesting_layer
        partial:
          client: ${{ workflow.er_client.return }}
          use_icons: false
          icon_size: 32
          legend_label_column: status
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_nests.return }}

      - name: Nests View State
        id: nests_view_state
        task: compute_fitted_view_state
        partial:
          max_zoom: ${{ workflow.nests_map_max_zoom.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.nests_layer.return }}

      - name: Combine Nests Layer and View State
        id: nests_map_inputs
        task: groupbykey
        partial:
          iterables:
            - ${{ workflow.nests_layer.return }}
            - ${{ workflow.nests_view_state.return }}

      - name: Draw Nests Map
        id: nests_map
        task: ecoscope.platform.tasks.results.draw_map
        partial:
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          output_type: html
          title: null
          max_zoom: ${{ workflow.nests_map_max_zoom.return }}
          legend_style:
            placement: bottom-right
        mapvalues:
          argnames: [geo_layers, view_state]
          argvalues: ${{ workflow.nests_map_inputs.return }}

      - name: Persist Nests Map
        id: persist_nests_map
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nests_map
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.nests_map.return }}

      - name: Nests Map Widget
        id: nests_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nests Due for Hatching"
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.persist_nests_map.return }}

      - name: Merge Nests Map Widget Views
        id: nests_map_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.nests_map_widget.return }}

  # ── Summary Table ─────────────────────────────────────────────────────────────

  - title: Summary Table
    type: task-group
    description: ""
    tasks:

      - name: Nests Due Table
        id: nests_due_table_df
        task: create_nests_due_table
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_nests.return }}

      - name: Draw Nests Due Table
        id: nests_due_table_drawn
        task: draw_table
        partial:
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "nests_due_table_widget"
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.nests_due_table_df.return }}

      - name: Persist Nests Due Table
        id: persist_nests_due_table
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nests_due_table
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.nests_due_table_drawn.return }}

      - name: Nests Due Table Widget
        id: nests_due_table_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nest Summary"
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.persist_nests_due_table.return }}

      - name: Merge Nests Due Table Widget Views
        id: nests_due_table_widget_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.nests_due_table_widget.return }}

  # ── Dashboard ─────────────────────────────────────────────────────────────────

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      groupers: ${{ workflow.groupers.return }}
      widgets:
        - ${{ workflow.overdue_widget_merged.return }}
        - ${{ workflow.due7_widget_merged.return }}
        - ${{ workflow.nests_map_widget_merged.return }}
        - ${{ workflow.nests_due_table_widget_merged.return }}
      time_range: ${{ workflow.time_range.return }}
