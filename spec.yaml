# Nests Due for Hatching — Daily Operations Workflow
#
# Data source: suspected_nest_v2 only.
#
# attempt_v2 is excluded from this workflow. It records crawls where the turtle
# made body pits but did not lay eggs, so no expected_hatching_date exists and
# it carries no hatching schedule information.

id: nests_due_hatching

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge
  - name: ecoscope-workflows-ext-curacao
    version: "*"
    channel: file:///tmp/ecoscope-workflows-custom/release/artifacts/

rjsf-overrides:
  # ── Status Colors ─────────────────────────────────────────────────────────────
  Nests Map.properties.nests_colormap.properties.custom_colors.default:
    - "#e53e3e"
    - "#dd6b20"
    - "#38a169"
    - "#718096"
  Nests Map.properties.nests_colormap.properties.custom_colors.description: >
    Colors for Overdue, Due within 7 days, Active, Unknown — in that order.

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  # ── Fetch & Process ───────────────────────────────────────────────────────────

  - name: Fetch Nest Events
    id: all_events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - geometry
        - event_details
      event_types:
        - suspected_nest_v2
      include_details: true
      include_display_values: true
      raise_on_empty: false
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      force_point_geometry: true

  - name: Process Event Details
    id: all_events_processed
    task: process_events_details
    partial:
      df: ${{ workflow.all_events.return }}
      client: ${{ workflow.er_client.return }}
      map_to_titles: true
      ordered: false

  - name: Extract Nest Due Fields
    id: nests_df
    task: extract_nest_due_fields
    partial:
      df: ${{ workflow.all_events_processed.return }}

  # ── Headline Stats ────────────────────────────────────────────────────────────

  - title: Headline Stats
    type: task-group
    description: Count of nests that are overdue or due within 7 days.
    tasks:

      - name: Filter Overdue Nests
        id: overdue_nests
        task: filter_row_values
        partial:
          df: ${{ workflow.nests_df.return }}
          column: status
          values:
            - Overdue

      - name: Overdue Nests Count
        id: overdue_count
        task: dataframe_count
        partial:
          df: ${{ workflow.overdue_nests.return }}

      - name: Overdue Nests Widget
        id: overdue_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Overdue Nests"
          decimal_places: 0
          data: ${{ workflow.overdue_count.return }}

      - name: Filter Nests Due Within 7 Days
        id: due7_nests
        task: filter_row_values
        partial:
          df: ${{ workflow.nests_df.return }}
          column: status
          values:
            - Due within 7 days

      - name: Nests Due Within 7 Days Count
        id: due7_count
        task: dataframe_count
        partial:
          df: ${{ workflow.due7_nests.return }}

      - name: Nests Due Within 7 Days Widget
        id: due7_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Due Within 7 Days"
          decimal_places: 0
          data: ${{ workflow.due7_count.return }}

  # ── Map ───────────────────────────────────────────────────────────────────────

  - title: Nests Map
    type: task-group
    description: ""
    tasks:

      - name: Nests Colormap
        id: nests_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.nests_df.return }}
          input_column_name: status
          custom_colors:
            - "#e53e3e"
            - "#dd6b20"
            - "#38a169"
            - "#718096"

      - name: Nests Layer
        id: nests_layer
        task: create_nesting_layer
        partial:
          df: ${{ workflow.nests_colormap.return }}
          client: ${{ workflow.er_client.return }}
          use_icons: false

      - name: Nests View State
        id: nests_view_state
        task: compute_fitted_view_state
        partial:
          geo_layers: ${{ workflow.nests_layer.return }}
          max_zoom: 15

      - name: Draw Nests Map
        id: nests_map
        task: draw_map_curacao
        partial:
          geo_layers: ${{ workflow.nests_layer.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          max_zoom: 15
          view_state: ${{ workflow.nests_view_state.return }}
          legend_style:
            placement: bottom-right

      - name: Persist Nests Map
        id: persist_nests_map
        task: persist_text
        partial:
          text: ${{ workflow.nests_map.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nests_map

      - name: Nests Map Widget
        id: nests_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nests Due for Hatching"
          data: ${{ workflow.persist_nests_map.return }}

  # ── Summary Table ─────────────────────────────────────────────────────────────

  - title: Summary Table
    type: task-group
    description: ""
    tasks:

      - name: Nests Due Table
        id: nests_due_table_df
        task: create_nests_due_table
        partial:
          df: ${{ workflow.nests_df.return }}

      - name: Draw Nests Due Table
        id: nests_due_table_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.nests_due_table_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "nests_due_table_widget"

      - name: Persist Nests Due Table
        id: persist_nests_due_table
        task: persist_text
        partial:
          text: ${{ workflow.nests_due_table_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nests_due_table

      - name: Nests Due Table Widget
        id: nests_due_table_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nest Summary"
          data: ${{ workflow.persist_nests_due_table.return }}

  # ── Dashboard ─────────────────────────────────────────────────────────────────

  - name: Create Dashboard
    id: dashboard
    task: gather_nests_due_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      nests_df: ${{ workflow.nests_df.return }}
      widgets:
        - ${{ workflow.overdue_widget.return }}
        - ${{ workflow.due7_widget.return }}
        - ${{ workflow.nests_map_widget.return }}
        - ${{ workflow.nests_due_table_widget.return }}
      time_range: ${{ workflow.time_range.return }}
